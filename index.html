<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echoes of Eldoria</title>
<style>
  /* The game renders at a fixed 800x600 "virtual" resolution and is scaled with
     nearest-neighbour filtering so every procedural pixel stays crisp. */
  html, body { margin: 0; height: 100%; background: #07040f; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    box-shadow: 0 0 60px rgba(140, 90, 220, .35);
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<script>
'use strict';
/* =============================================================================
 *  ECHOES OF ELDORIA
 *  A vertical puzzle-platformer in one file. Every pixel, every sound and every
 *  note of music is generated at runtime: no external assets.
 *
 *  Layout of this file
 *   1.  Constants & utilities
 *   2.  Input
 *   3.  Audio (procedural SFX + ambient music)
 *   4.  Level data (tile map + entity placement)
 *   5.  Procedural art: tiles, backgrounds, wizard sprite, logo
 *   6.  Entities (coins, keys, runes, anchors, movers, vines, boulders, emblem)
 *   7.  Player physics (AABB, wall-slide, wall-jump, dash, grapple)
 *   8.  Tools (Twining Tendril, Glacial Glare)
 *   9.  Particles, screen shake, toasts
 *  10.  Camera & rooms
 *  11.  Rendering (world, lighting, HUD)
 *  12.  Game states (title, play, pause, victory) & main loop
 * ========================================================================== */

/* ============================== 1. CONSTANTS ============================== */
const W = 800, H = 600;              // virtual screen
const TILE = 16;                     // tile size in pixels
const COLS = 50, ROWS = 113;         // 800 x 1808 px tile map
const ROOM_H = 600;                  // the 1800px tower is split into 3 screens
const STEP_HZ = 240;                 // physics sub-step rate

// Player movement tuning
const RUN_SPEED = 140, JUMP_VEL = 420, GRAVITY = 1500, FALL_GRAVITY = 1700, MAX_FALL = 540;
const WALL_SLIDE = 70, WALL_JUMP_X = 300, WALL_JUMP_Y = 320;     // ~45 degree ricochet
const DASH_SPEED = 460, DASH_TIME = 0.15, DASH_COOLDOWN = 1.5;
const GRAPPLE_RANGE = 200, GRAPPLE_SPEED = 470, GRAPPLE_CAST = 1800;
const FREEZE_TIME = 4, GLARE_RANGE = 330;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

function fitCanvas() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fitCanvas); fitCanvas();

const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const approach = (v, t, d) => (v < t ? Math.min(v + d, t) : Math.max(v - d, t));
/** Deterministic 0..1 hash: gives every tile stable procedural variation. */
function hash(x, y, s = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul((s | 0) + 1, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
/** Seeded PRNG for repeatable background generation. */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeCanvas(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  return [c, g];
}
function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
const rectsOverlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function fmtTime(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60), cs = Math.floor((t * 100) % 100);
  return `${m}:${String(s).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
}

/* ================================ 2. INPUT ================================ */
const keys = {}, pressed = {}, released = {};
const mouse = { x: W / 2, y: H / 2, lastMove: -99 };
addEventListener('keydown', e => {
  if (!e.repeat) pressed[e.code] = true;
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
  Sound.init();
});
addEventListener('keyup', e => { keys[e.code] = false; released[e.code] = true; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') state = 'pause'; });
function canvasPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
canvas.addEventListener('mousemove', e => { const p = canvasPos(e); mouse.x = p.x; mouse.y = p.y; mouse.lastMove = clock; });
canvas.addEventListener('mousedown', e => {
  const p = canvasPos(e); mouse.x = p.x; mouse.y = p.y; mouse.lastMove = clock;
  pressed[e.button === 2 ? 'Mouse2' : 'Mouse0'] = true;
  Sound.init();
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

const jumpHeld = () => keys.Space || keys.KeyW || keys.ArrowUp;
/** Takes a snapshot of edge-triggered input for this frame and clears it. */
function takeInput() {
  const snap = { pressed: { ...pressed }, released: { ...released } };
  for (const k in pressed) delete pressed[k];
  for (const k in released) delete released[k];
  return snap;
}

/* ================================ 3. AUDIO ================================ */
/* All sound is synthesised with the Web Audio API: oscillators, filtered
 * noise and envelopes. A gentle per-biome arpeggio plays through a feedback
 * delay (an "echo"), which fits the game's theme. */
const Sound = (() => {
  let ac = null, master, sfx, music, delay, noiseBuf, muted = false;
  let theme = 2, nextNote = 0, step = 0;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const SCALES = { major: [0, 2, 4, 5, 7, 9, 11], dorian: [0, 2, 3, 5, 7, 9, 10], minor: [0, 2, 3, 5, 7, 8, 10] };
  const THEMES = [   // indexed by room: 0 Sanctuary, 1 Falls, 2 Village
    { root: 57, scale: 'minor',  prog: [0, 5, 3, 4], lead: 'sine',     bpm: 74 },
    { root: 62, scale: 'dorian', prog: [0, 3, 6, 4], lead: 'sine',     bpm: 80 },
    { root: 60, scale: 'major',  prog: [0, 5, 3, 4], lead: 'triangle', bpm: 92 },
  ];

  function init() {
    if (ac) { if (ac.state !== 'running') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0.7; master.connect(ac.destination);
    sfx = ac.createGain(); sfx.gain.value = 0.55; sfx.connect(master);
    music = ac.createGain(); music.gain.value = 0.17; music.connect(master);
    // feedback delay = the "echo"
    delay = ac.createDelay(1); delay.delayTime.value = 0.36;
    const fb = ac.createGain(); fb.gain.value = 0.38;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
    music.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay); fb.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    nextNote = ac.currentTime + 0.15;
    setInterval(schedule, 50);
  }

  /** Oscillator voice with an exponential sweep and envelope. */
  function tone(type, f0, f1, dur, vol, t0, dest, attack = 0.005) {
    if (!ac) return;
    t0 = t0 || ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(dest || sfx);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  /** Filtered white-noise burst. */
  function noise(dur, vol, type, f0, f1, t0, q = 1) {
    if (!ac) return;
    t0 = t0 || ac.currentTime;
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t0);
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(sfx);
    s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.05);
  }

  // ---------- ambient music ----------
  function noteOf(th, deg, oct = 0) {
    const sc = SCALES[th.scale], o = Math.floor(deg / 7), d = ((deg % 7) + 7) % 7;
    return th.root + sc[d] + 12 * (o + oct);
  }
  function schedule() {
    if (!ac || ac.state !== 'running') return;
    const th = THEMES[theme];
    if (nextNote < ac.currentTime - 0.1) nextNote = ac.currentTime + 0.05;
    while (nextNote < ac.currentTime + 0.25) {
      if (!muted) playStep(th, step, nextNote);
      nextNote += 60 / th.bpm / 2;
      step++;
    }
  }
  const ARP = [0, 1, 2, 3, 2, 1, 2, 1];
  function playStep(th, s, t) {
    const bar = Math.floor(s / 8) % 4, i = s % 8, deg = th.prog[bar];
    const chord = [deg, deg + 2, deg + 4, deg + 7];
    const n = noteOf(th, chord[ARP[i]]);
    tone(th.lead, mtof(n), 0, 0.42, 0.05, t, music, 0.01);
    if (i === 0 || i === 4) tone('sine', mtof(noteOf(th, deg, -2)), 0, 0.9, 0.12, t, music, 0.02);
    if (i === 0) for (let k = 0; k < 3; k++) tone('triangle', mtof(noteOf(th, deg + k * 2, -1)), 0, 2.4, 0.022, t, music, 0.4);
    if (i % 2 === 1 && hash(s, theme, 3) > 0.55) {
      const m = noteOf(th, chord[Math.floor(hash(s, 1, 9) * 3)], 1);
      tone('sine', mtof(m), 0, 0.8, 0.03, t, music, 0.01);
    }
  }

  // ---------- sound effects ----------
  const fx = {
    jump()   { tone('triangle', 300, 760, 0.13, 0.22); },
    wallJump() { tone('triangle', 360, 900, 0.12, 0.2); noise(0.06, 0.12, 'highpass', 3000); },
    land()   { noise(0.08, 0.18, 'lowpass', 700, 200); },
    dash()   { noise(0.22, 0.45, 'highpass', 900, 5000, 0, 0.7); tone('sine', 900, 300, 0.15, 0.06); },
    crash()  { noise(0.15, 0.4, 'lowpass', 900, 120); tone('square', 120, 50, 0.12, 0.12); },
    cast()   { noise(0.12, 0.12, 'bandpass', 600, 2400, 0, 3); },
    grapple(){ tone('square', 523, 523, 0.18, 0.12); tone('square', 784, 784, 0.12, 0.07, ac && ac.currentTime + 0.04); },
    freeze() {
      const t = ac ? ac.currentTime : 0;
      [1760, 2637, 3520, 5274].forEach((f, i) => tone('sine', f, f * 0.995, 1.4 - i * 0.25, 0.09 - i * 0.015, t + i * 0.01));
      noise(0.4, 0.06, 'highpass', 7000);
    },
    fizzle() { noise(0.15, 0.1, 'highpass', 4000, 8000); },
    fall()   { tone('sawtooth', 620, 70, 0.7, 0.16); },
    die()    { tone('sawtooth', 440, 55, 0.5, 0.18); noise(0.35, 0.25, 'lowpass', 2000, 150); },
    coin()   { const t = ac ? ac.currentTime : 0; tone('square', 988, 988, 0.07, 0.07, t); tone('square', 1319, 1319, 0.22, 0.07, t + 0.07); },
    key()    { const t = ac ? ac.currentTime : 0; [784, 988, 1175, 1568].forEach((f, i) => tone('triangle', f, f, 0.25, 0.12, t + i * 0.07)); },
    unlock() { noise(0.6, 0.4, 'lowpass', 2500, 100); tone('sine', 110, 40, 0.5, 0.35); },
    rune()   {
      const t = ac ? ac.currentTime : 0;
      [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone('triangle', f, f, 0.5, 0.1, t + i * 0.09));
      tone('sine', 262, 262, 1.6, 0.12, t, 0, 0.2);
    },
    victory() {
      const t = ac ? ac.currentTime : 0;
      const seq = [523, 659, 784, 1047, 784, 1047, 1319, 1568];
      seq.forEach((f, i) => tone('triangle', f, f, 0.6, 0.12, t + i * 0.12));
      [262, 330, 392, 523].forEach(f => tone('sine', f, f, 3, 0.06, t + 1, 0, 0.3));
    },
    select() { tone('square', 660, 990, 0.08, 0.08); },
  };

  return {
    init, fx,
    setTheme(i) { if (i !== theme) { theme = i; } },
    toggleMute() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.7; return muted; },
    get muted() { return muted; },
  };
})();

/* ============================== 4. LEVEL DATA ============================== */
/* Tile legend
 *   ' ' air          '#' biome ground (solid)     '=' thatch roof (solid)
 *   '-' one-way ledge (pass-through from below and during grapple flight)
 *   'H' house wall (background decoration)        'L' security block (solid until key)
 *   '^' thorn block (hazard)
 * The tower is 113 rows tall. Room 0 (top) = Sylvan Sanctuary, room 1 = Faelyn
 * Falls, room 2 (bottom) = Lurielle Village. The player climbs upward. */
const BIOMES = [
  { name: 'Sylvan Sanctuary', sub: 'Where the elder trees remember the dragon' },
  { name: 'Faelyn Falls', sub: 'The water sings in echoes' },
  { name: 'Lurielle Village', sub: 'The village that cast you out' },
];
const roomOfRow = r => (r <= 37 ? 0 : r <= 74 ? 1 : 2);
const roomOfY = y => clamp(Math.floor(y / ROOM_H), 0, 2);

let map = [];
function buildMap() {
  const m = [];
  for (let r = 0; r < ROWS; r++) m.push(new Array(COLS).fill(' '));
  const R = (c0, r0, c1, r1, ch) => {
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (r >= 0 && r < ROWS && c >= 0 && c < COLS) m[r][c] = ch;
  };
  // outer shell
  R(0, 0, 0, ROWS - 1, '#'); R(49, 0, 49, ROWS - 1, '#'); R(0, 0, 49, 0, '#');

  // ---------------- Room 2: Lurielle Village (rows 75-112) ----------------
  R(0, 110, 49, 112, '#');                 // village green
  R(5, 75, 49, 76, '#');                   // earthen ceiling
  R(5, 75, 5, 81, '#');                    // exit shaft wall
  R(1, 77, 4, 77, 'L');                    // security blocks sealing the exit shaft
  R(2, 85, 7, 109, 'H'); R(1, 84, 8, 84, '=');      // house A
  R(13, 87, 17, 109, 'H'); R(12, 86, 18, 86, '=');  // house B
  R(23, 85, 27, 109, 'H'); R(22, 84, 28, 84, '=');  // house C (thorn patrol on roof)
  R(32, 86, 38, 86, '-');                  // oak scaffold
  R(41, 88, 44, 106, '#');                 // bell tower (tunnel underneath)
  R(45, 99, 48, 99, '-');                  // rest ledge in the tower shaft
  R(10, 109, 11, 109, '^');                // bramble patch
  R(29, 110, 35, 110, ' '); R(29, 111, 35, 111, '^');   // thorn pit (needs Dash)

  // ---------------- Room 1: Faelyn Falls (rows 38-74) ----------------
  R(0, 38, 49, 41, '#'); R(22, 38, 25, 41, ' ');   // rock ceiling with exit shaft
  R(22, 40, 25, 40, 'L');                          // security blocks
  R(5, 72, 49, 74, '#');                           // floor (shaft c1-4 leads down)
  R(20, 72, 39, 72, ' '); R(20, 73, 39, 73, '^');  // crystal-thorn basin
  R(40, 68, 48, 71, '#');                          // right cliff
  R(13, 69, 18, 69, '-');                          // rune ledge
  R(30, 54, 38, 54, '-');                          // crystal ledge U1
  R(22, 52, 26, 52, '-');                          // crystal ledge U2
  R(1, 50, 17, 51, '#');                           // key ledge
  R(18, 47, 26, 47, '-');                          // exit ledge

  // ---------------- Room 0: Sylvan Sanctuary (rows 0-37) ----------------
  R(0, 35, 49, 37, '#'); R(22, 35, 25, 37, ' ');   // mossy floor with entry shaft
  R(29, 34, 47, 34, '^');                          // thorn brambles
  R(2, 32, 7, 32, '#');
  R(8, 29, 12, 29, '-');
  R(2, 26, 9, 26, '#');
  R(38, 26, 48, 27, '#');                          // boulder ledge
  R(36, 22, 42, 22, '#');
  R(27, 19, 32, 19, '-');
  R(14, 16, 22, 16, '#');
  R(1, 10, 5, 10, '#');                            // key ledge
  R(16, 8, 33, 8, '#');                            // shrine floor
  R(18, 1, 31, 2, '#');                            // shrine roof
  R(18, 3, 18, 7, 'L'); R(31, 3, 31, 7, 'L');      // shrine security walls
  return m;
}

// Entity placement (tile coordinates unless noted)
const LEVEL = {
  checkpoints: [ { x: 18 * 16 + 3, y: 35 * 16 }, { x: 8 * 16 + 3, y: 72 * 16 }, { x: 3 * 16 + 3, y: 110 * 16 } ],
  coins: [
    // village
    [6, 108], [8, 108], [10, 106], [11, 106], [17, 108], [30, 106], [32, 105], [34, 106], [46, 102], [47, 93],
    [4, 82], [15, 84], [25, 81], [35, 84], [43, 85],
    // falls
    [9, 70], [22, 66], [29, 63], [37, 63], [44, 65], [43, 58], [34, 52], [24, 50], [8, 48], [14, 48], [22, 45],
    // sanctuary
    [12, 33], [15, 33], [4, 30], [10, 27], [20, 24], [28, 23], [42, 24], [39, 19], [30, 16], [18, 14], [8, 11], [3, 8], [22, 5], [27, 5],
  ],
  keys: [ { x: 2.5, y: 9.4, room: 0 }, { x: 3.5, y: 49.4, room: 1 }, { x: 42.5, y: 87.4, room: 2 } ],
  runes: [ { x: 8.5, y: 35, type: 'glare' }, { x: 16, y: 69, type: 'tendril' }, { x: 20.5, y: 110, type: 'dash' } ],
  anchors: [ [24, 64], [34, 61], [23, 39], [23, 28], [14, 4] ],
  movers: [
    { kind: 'h', x0: 25 * 16, x1: 33 * 16, y: 66 * 16, w: 48, period: 4.2, room: 1 },
    { kind: 'v', x: 42 * 16, y0: 55 * 16, y1: 67 * 16, w: 48, period: 5.5, room: 1 },
    { kind: 'h', x0: 11 * 16, x1: 33 * 16, y: 26 * 16, w: 48, period: 3.0, room: 0 },
    { kind: 'h', x0: 5 * 16, x1: 12 * 16, y: 13 * 16, w: 48, period: 4.0, room: 0 },
  ],
  patrols: [ { x0: 22 * 16, x1: 26 * 16, y: 83 * 16, period: 3.2, room: 2 } ],
  vines: [
    { x: 456, top: 672, tipMin: 720, tipMax: 880, period: 3.2, room: 1 },
    { x: 168, top: 672, tipMin: 704, tipMax: 798, period: 2.6, room: 1 },
    { x: 392, top: 144, tipMin: 180, tipMax: 312, period: 3.0, room: 0 },
  ],
  spawners: [ { x: 716, y: 26, interval: 2.6, room: 0 }, { x: 280, y: 158, interval: 3.0, room: 0 } ],
  emblem: { x: 400, y: 92 },
};

/* ============================ 5. PROCEDURAL ART ============================ */
// ---- palettes ----
const PAL = {
  village: { dirt: '#6b4423', dirtD: '#57361b', dirtL: '#7c5230', out: '#2b1a10', grass: '#3fa34d', grassL: '#7bed9f', grassD: '#2d7a39', blade: '#4cd137' },
  falls:   { rock: '#2f5463', rockD: '#264654', rockL: '#4f7d8c', out: '#0b1d26', wet: '#7fe0f0', moss: '#16a085', crystal: '#48dbfb' },
  sanct:   { stone: '#4b5d50', stoneD: '#2b3a30', stoneL: '#5e7563', out: '#121a14', moss: '#27ae60', mossL: '#2ecc71', flower: '#ff6bcb' },
};
const isSolid = ch => ch === '#' || ch === '=' || ch === 'L';
function tileAt(c, r) {
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return '#';
  return map[r][c];
}
const isOpen = (c, r) => !isSolid(tileAt(c, r));

// Light sources baked from tile decoration (windows, flowers, crystals)
let staticLights = [];

/* ---------- tile painters (each draws one 16x16 tile at x,y) ---------- */
function outlineEdges(g, x, y, c, r, col) {
  g.fillStyle = col;
  if (isOpen(c - 1, r)) g.fillRect(x, y, 2, 16);
  if (isOpen(c + 1, r)) g.fillRect(x + 14, y, 2, 16);
  if (isOpen(c, r + 1)) g.fillRect(x, y + 14, 16, 2);
  if (isOpen(c, r - 1)) g.fillRect(x, y, 16, 2);
}
function speckle(g, x, y, c, r, n, cols) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = cols[Math.floor(hash(c, r, i) * cols.length)];
    g.fillRect(x + Math.floor(hash(c, r, i + 20) * 15), y + Math.floor(hash(c, r, i + 40) * 15), 1 + (hash(c, r, i + 60) > 0.8 ? 1 : 0), 1);
  }
}
function paintGroundVillage(g, x, y, c, r) {
  const P = PAL.village;
  g.fillStyle = P.dirt; g.fillRect(x, y, 16, 16);
  speckle(g, x, y, c, r, 8, [P.dirtD, P.dirtL, '#4a2c14']);
  if (hash(c, r, 99) > 0.7) {          // pebble
    const px = x + 2 + Math.floor(hash(c, r, 98) * 10), py = y + 4 + Math.floor(hash(c, r, 97) * 8);

/* ---------- pixel-art logo (text rasterised small, thresholded, scaled) ---------- */

  const px = (x, y, col) => { g.fillStyle = col; g.fillRect((x + 2) * scale, (y + 2) * scale, scale, scale); };

  for (let y = 0; y < th; y++) for (let x = 0; x < tw; x++) if (on(x, y)) {
    const t = (y - minY) / Math.max(1, maxY - minY);

/** Horizontal move with tile collision; returns true if blocked. Snaps flush to the tile edge. */

  } else {
    const c = Math.floor(o.x / TILE);

    }

    const r = Math.floor(o.y / TILE);

    if ((p.onGround || p.coyote > 0) && down && standingOnOneWay(p)) {
      p.dropT = 0.25; p.jumpBuf = 0; p.onGround = false; p.platform = null; p.y += 1;
    } else if (p.onGround || p.coyote > 0) doJump(p);
    else if (p.wallDir !== 0) wallJump(p, p.wallDir);
    else if (p.wallCoyote > 0) wallJump(p, p.lastWall);
  }
  if (p.jumping && !jumpHeld() && p.vy < 0) { p.vy *= 0.45; p.jumping = false; }    // variable height

  // ----- pink magical dash -----
  if (p.dashT > 0) {
    p.dashT -= h; p.vx = p.dashDir * DASH_SPEED; p.vy = 0;
    p.ghostT -= h;
    if (p.ghostT <= 0) { p.ghostT = 0.034; p.ghosts.push({ x: p.x, y: p.y, face: p.face, a: 0.55 }); if (p.ghosts.length > 4) p.ghosts.shift(); }
    if (Math.random() < 0.6) particles.push({ x: p.x + rand(0, p.w), y: p.y + rand(2, p.h), vx: -p.dashDir * rand(10, 60), vy: rand(-20, 20), life: rand(0.25, 0.5), max: 0.5, size: rand(2, 4) | 0, col: Math.random() < 0.5 ? '#ff6bcb' : '#ffb8e6', g: 0, type: 'sq' });
    if (moveX(p, p.vx * h)) {        // crashed into a wall
      p.dashT = 0; p.vx = 0;
      addShake(4, 0.15); Sound.fx.crash();
      for (let i = 0; i < 12; i++) particles.push({ x: p.x + (p.dashDir > 0 ? p.w : 0), y: p.y + rand(2, 18), vx: -p.dashDir * rand(40, 180), vy: rand(-120, 60), life: 0.5, max: 0.5, size: 2, col: i % 2 ? '#ff6bcb' : '#ffffff', g: 400, type: 'sq' });
    }
    if (p.dashT <= 0) p.vx = p.dashDir * RUN_SPEED;
    p.onGround = false;
    return;
  }

  // ----- run with rapid deceleration -----
  if (p.wallLock > 0) ix = 0;
  const target = ix * RUN_SPEED;
  const accel = p.onGround ? (ix ? 2600 : 3400) : (ix ? 1500 : 450);
  if (p.wallLock <= 0) p.vx = approach(p.vx, target, accel * h);
  if (ix) p.face = ix;

  // ----- gravity & wall slide -----
  p.vy += (p.vy > 0 ? FALL_GRAVITY : GRAVITY) * h;
  p.sliding = false;
  if (!p.onGround && p.vy > 0 && p.wallDir !== 0 && ix !== -p.wallDir) {
    if (p.vy > WALL_SLIDE) p.vy = WALL_SLIDE;
    p.sliding = true;
    if (Math.random() < 0.08) particles.push({ x: p.x + (p.wallDir > 0 ? p.w : 0), y: p.y + 4, vx: -p.wallDir * 15, vy: -10, life: 0.4, max: 0.4, size: 2, col: '#dfe6e9', g: 0, type: 'sq' });
  }
  if (p.vy > MAX_FALL) p.vy = MAX_FALL;

  // ----- integrate with AABB collision -----
  if (moveX(p, p.vx * h)) p.vx = 0;
  const wasGround = p.onGround, prevBottom = p.y + p.h, impact = p.vy;
  if (!p.platform) p.onGround = false;
  const ry = moveY(p, p.vy * h, p.dropT <= 0);
  if (ry === 1) { land(p, wasGround ? 0 : impact); p.platform = null; }
  else if (ry === -1) { p.vy = 0; p.jumping = false; }
  if (p.vy >= 0 && p.dropT <= 0 && !p.platform) {
    for (const pl of platforms()) {
      if (p.x + p.w > pl.left + 1 && p.x < pl.right - 1 && prevBottom <= pl.prevTop + 2 && p.y + p.h >= pl.top) {
        p.y = pl.top - p.h; land(p, wasGround ? 0 : impact); p.platform = pl; break;
      }
    }
  }
  if (p.onGround) { p.coyote = 0.09; p.wallDir = 0; }
  else {
    // wall contact (for sliding / ricochet)
    const t = p.y + 3, b = p.y + p.h - 3;
    if (solidAt(p.x - 1, t) || solidAt(p.x - 1, b)) p.wallDir = -1;
    else if (solidAt(p.x + p.w + 1, t) || solidAt(p.x + p.w + 1, b)) p.wallDir = 1;
    else p.wallDir = 0;
    if (p.wallDir) { p.wallCoyote = 0.1; p.lastWall = p.wallDir; }
  }
}

/** Damage check against every hazard: thorns, patrols, spiked vines, boulders. */
function checkHazards() {
  const p = P;
  if (p.dead) return;
  const hb = { x: p.x + 2, y: p.y + 3, w: p.w - 4, h: p.h - 4 };
  const c0 = Math.floor(hb.x / TILE), c1 = Math.floor((hb.x + hb.w) / TILE), r0 = Math.floor(hb.y / TILE), r1 = Math.floor((hb.y + hb.h) / TILE);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++)
    if (tileAt(c, r) === '^' && rectsOverlap(hb, { x: c * TILE + 1, y: r * TILE + 7, w: 14, h: 9 })) return killPlayer();
  for (const m of movers) if (m.hazard && rectsOverlap(hb, { x: m.x + 2, y: m.y + 2, w: m.w - 4, h: m.h - 4 })) return killPlayer();
  for (const v of vines) if (rectsOverlap(hb, { x: v.x - 4, y: v.top, w: 8, h: v.tip - v.top + 3 })) return killPlayer();
  for (const b of boulders) {
    if (b.frozen > 0 || b === p.platform) continue;
    const nx = clamp(b.x, hb.x, hb.x + hb.w), ny = clamp(b.y, hb.y, hb.y + hb.h);
    if (Math.hypot(b.x - nx, b.y - ny) < b.r - 2) return killPlayer();
  }
}

}

/* ================================ 8. TOOLS ================================ */
let activeTool = 'none', glareCd = 0, aiming = false, reticle = { x: 0, y: 0, target: null, t: 0 };

/** Ray-march between two points through solid tiles (ledges don't block). */
function lineOfSight(x0, y0, x1, y1) {
  const d = Math.hypot(x1 - x0, y1 - y0), n = Math.ceil(d / 4);
  for (let i = 1; i < n; i++) {
    const t = i / n;
    if (solidAt(lerp(x0, x1, t), lerp(y0, y1, t))) return false;
  }
  return true;
}

  return { x: P.x + P.w / 2 + P.face * 6, y: P.y - 1 };
}
/** Picks an anchor: nearest to the cursor on click, or the best one ahead of the player on E. */
function findAnchor(useMouse) {
  const cx = P.x + P.w / 2, cy = P.y + P.h / 2;
  let best = null, bestScore = 1e9;
  for (const a of anchors) {
    const d = Math.hypot(a.x - cx, a.y - cy);
    if (d > GRAPPLE_RANGE || d < 36 || !lineOfSight(cx, cy, a.x, a.y)) continue;
    let score;
    if (useMouse) score = Math.hypot(a.x - mouse.x, a.y - (mouse.y + camY));
    else score = d - (Math.sign(a.x - cx) === P.face ? 60 : 0) - (a.y < cy ? 40 : 0);
    if (score < bestScore) { bestScore = score; best = a; }

}

  activeTool = 'tendril';
  if (!a) {
    Sound.fx.fizzle();
    const t = staffTip(); leafBurst(t.x, t.y, 4);
    return;
  }

  P.dashT = 0;

}
function updateTendril(dt) {

  for (const v of vines) out.push({ o: v, x: v.x, y: v.tip - 6, r: 14 });

function updateGlareAim(dt) {

/* ============================ 10. CAMERA & ROOMS ============================ */
let camRoom = 2, camY = 2 * ROOM_H;
/** Room-based camera: snaps up a screen only when the player crosses the top edge;
 *  falling below the bottom edge drops the camera back down (with a jolt). */
function updateCamera(dt) {
  if (!P.dead) {
    const pr = roomOfY(P.y + P.h / 2);
    if (pr < camRoom) {
      camRoom = pr;
      Sound.setTheme(camRoom);
      if (!visited[camRoom]) { visited[camRoom] = true; showToast(BIOMES[camRoom].name, BIOMES[camRoom].sub); }
    } else if (pr > camRoom) {
      camRoom = pr;
      Sound.setTheme(camRoom);
      Sound.fx.fall();
      addShake(4, 0.15);
      showToast('You fell!', 'Back to ' + BIOMES[camRoom].name, 1.6, '#ff8f8f');
    }
  }
  const target = camRoom * ROOM_H;
  camY += (target - camY) * Math.min(1, dt * 12);
  if (Math.abs(target - camY) < 0.5) camY = target;
}

/* ============================== 11. RENDERING ============================== */
const [lightCanvas, lightG] = makeCanvas(W / 2, H / 2);
lightG.imageSmoothingEnabled = true;
let clock = 0;

function drawBackground(room) {
  const bg = BG[room], y0 = room * ROOM_H;
  ctx.drawImage(bg.sky, 0, y0);
  const px = (P ? P.x : 400) - 400;
  for (const [layer, f] of bg.layers) ctx.drawImage(layer, Math.round(-100 - px * f - (room === 2 ? 0 : 0)), y0);
  if (room === 2) {                                    // drifting pixel clouds
    for (let i = 0; i < 5; i++) {
      const cx = ((i * 211 + clock * (6 + i * 2)) % 1000) - 100, cy = y0 + 60 + i * 42;
      ctx.fillStyle = i % 2 ? 'rgba(255,190,118,0.75)' : 'rgba(255,214,165,0.6)';

      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.fillRect(Math.round(s.x), y0 + Math.round(s.y), 1, 1);

    }
    for (const b of bg.blossoms) {

      ctx.fillStyle = `rgba(255,107,203,${0.35 + a * 0.5})`;
      ctx.fillRect(Math.round(b.x - 100 - px * 0.12) - 1, y0 + Math.round(b.y) - 1, 3, 3);

  }
}

    text(toast.sub, W / 2, 117, 11, '#e8e0ff', 'center');
    ctx.globalAlpha = 1;
  }
  // first-time hints
  if (state === 'play' && runTime < 9 && camRoom === 2) text('A/D or ←/→ to run · W/SPACE to jump (hold for higher) · slide down walls and jump to ricochet', W / 2, H - 16, 10, 'rgba(255,255,255,0.8)', 'center');
}
function drawReticle() {
  if (!aiming) return;
  const x = reticle.x, y = reticle.y - camY, t = reticle.t;
  const r = reticle.target ? reticle.target.r + 4 + Math.sin(t * 10) * 2 : 12;
  ctx.save(); ctx.translate(x, y); ctx.rotate(t * 2);
  ctx.strokeStyle = reticle.target ? '#dff9fb' : 'rgba(116,185,255,0.7)'; ctx.lineWidth = 2;
  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(0, 0, r, i * Math.PI / 2 + 0.2, i * Math.PI / 2 + 1.2); ctx.stroke(); }
  ctx.fillStyle = '#74b9ff';
  for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 2); ctx.fillRect(r + 2, -1, 5, 2); }
  ctx.restore();
  ctx.setLineDash([3, 4]); ctx.strokeStyle = 'rgba(116,185,255,0.45)'; ctx.lineWidth = 1;
  const s = staffTip();
  ctx.beginPath(); ctx.moveTo(s.x, s.y - camY); ctx.lineTo(x, y); ctx.stroke(); ctx.setLineDash([]);
}

/** Draws the whole game world for the current camera. */
function drawWorld(showPlayer) {
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = Math.round(rand(-1, 1) * shakeMag); sy = Math.round(rand(-1, 1) * shakeMag); }
  ctx.save();
  ctx.translate(sx, sy - Math.round(camY));
  for (let room = 0; room < 3; room++) {
    const top = room * ROOM_H;
    if (top < camY + H && top + ROOM_H > camY) drawBackground(room);
  }
  ctx.drawImage(tileLayer, 0, Math.round(camY), W, H, 0, Math.round(camY), W, H);
  const vis = y => y > camY - 80 && y < camY + H + 80;
  const target = showPlayer && P.abilities.tendril && !P.grapple ? findAnchor(clock - mouse.lastMove < 2.5) : null;
  for (const a of anchors) if (vis(a.y)) drawAnchor(a, a === target);
  for (const m of movers) if (vis(m.y)) drawMover(m);
  for (const v of vines) if (vis(v.top) || vis(v.tip)) drawVine(v);
  for (const b of boulders) if (vis(b.y)) drawBoulder(b);
  for (const c of coins) if (!c.taken && vis(c.y)) drawCoin(c.x, c.y + Math.sin(clock * 2 + c.ph) * 1.5, c.ph);
  for (const k of keyItems) if (!k.taken && vis(k.y)) drawKey(k);
  for (const r of runes) if (!r.taken && vis(r.y)) drawRune(r);
  if (vis(emblem.y)) drawEmblem(emblem.x, emblem.y + Math.sin(clock * 1.5) * 2, 1);
  if (showPlayer) { drawTendril(); drawWizard(); }
  drawParticles();
  if (vis(1000)) drawWaterForeground();
  ctx.restore();
  drawLighting(collectLights());
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(0.6, flash)})`; ctx.fillRect(0, 0, W, H); }
}

/* ======================= 12. GAME STATES & MAIN LOOP ======================= */
let state = 'title', runTime = 0, deaths = 0, visited = [false, false, true], victoryT = 0;
let logo, logoSmall, titleCam = 1200;
const startBtn = { x: W / 2 - 130, y: 470, w: 260, h: 44 };

function newGame() {
  map = buildMap();
  renderTiles();
  initEntities();
  P = null;
  resetPlayer(LEVEL.checkpoints[2]);
  camRoom = 2; camY = 2 * ROOM_H;
  runTime = 0; deaths = 0; visited = [false, false, true]; activeTool = 'none'; glareCd = 0; aiming = false;
  particles = []; toast = null;
  Sound.setTheme(2);
}
function beginPlay() {
  Sound.init();
  newGame();
  state = 'play';
  Sound.fx.select();
  showToast('Lurielle Village', 'The village that cast you out', 3.2);
}

/** Picking up keys, coins, runes and the emblem. */
function updatePickups() {
  const p = P;
  if (p.dead) return;
  const box = { x: p.x - 2, y: p.y - 2, w: p.w + 4, h: p.h + 4 };
  for (const c of coins) if (!c.taken && rectsOverlap(box, { x: c.x - 6, y: c.y - 7, w: 12, h: 14 })) {
    c.taken = true; Sound.fx.coin(); sparkle(c.x, c.y, '#fff176', 8, 60);
  }
  for (const k of keyItems) if (!k.taken && rectsOverlap(box, { x: k.x - 6, y: k.y - 10, w: 12, h: 22 })) {
    k.taken = true; Sound.fx.key(); sparkle(k.x, k.y, '#fff59d', 20, 90);
    // queue every security block in this room to burst, one after another
    const r0 = k.room === 0 ? 0 : k.room === 1 ? 38 : 75, r1 = k.room === 0 ? 37 : k.room === 1 ? 74 : ROWS - 1;
    let delay = 0.35;
    for (let r = r0; r <= r1; r++) for (let c = 0; c < COLS; c++) if (map[r][c] === 'L') { lockBreaks.push({ c, r, t: delay }); delay += 0.09; }
    showToast('Key of Warding', 'The security blocks crumble!', 2.2);
  }
  for (const r of runes) if (!r.taken && rectsOverlap(box, { x: r.x - 8, y: r.y - 30, w: 16, h: 30 })) {
    r.taken = true; p.abilities[r.type] = true; activeTool = r.type;
    Sound.fx.rune(); flash = 0.4;
    const col = r.type === 'dash' ? '#ff6bcb' : r.type === 'tendril' ? '#2ecc71' : '#74b9ff';
    for (let i = 0; i < 40; i++) { const a = i / 40 * TAU; particles.push({ x: r.x, y: r.y - 18, vx: Math.cos(a) * 160, vy: Math.sin(a) * 160, life: 0.8, max: 0.8, size: 2, col, g: 0, type: 'sq' }); }
    if (r.type === 'dash') showToast('Echo of Haste', 'Press SHIFT to dash. 1.5s cooldown', 4.5, '#ff9be0');
    if (r.type === 'tendril') showToast('Echo of the Wildwood', 'E or click: Twining Tendril to green anchors', 4.5, '#9bffb8');
    if (r.type === 'glare') showToast('Echo of Winter', 'Hold Q to aim, release to freeze. Right-click also works', 4.5, '#a8d8ff');
  }
  if (!emblem.taken && rectsOverlap(box, { x: emblem.x - 20, y: emblem.y - 24, w: 40, h: 48 })) {
    emblem.taken = true; state = 'victory'; victoryT = 0;
    Sound.fx.victory(); flash = 1;
  }
}
function updateLockBreaks(dt) {
  for (const lb of lockBreaks) {
    lb.t -= dt;
    if (lb.t <= 0 && !lb.done) {
      lb.done = true;
      map[lb.r][lb.c] = ' ';
      renderTiles(lb.c - 1, lb.r - 1, lb.c + 1, lb.r + 1, true);
      const x = lb.c * TILE + 8, y = lb.r * TILE + 8;
      for (let i = 0; i < 18; i++) particles.push({ x: x + rand(-6, 6), y: y + rand(-6, 6), vx: rand(-160, 160), vy: rand(-220, 40), life: rand(0.5, 1), max: 1, size: rand(2, 4) | 0, col: ['#4a4a5a', '#8395a7', '#f1c40f', '#3a3a48'][i % 4], g: 600, type: 'sq' });
      Sound.fx.unlock(); addShake(3, 0.12);
    }
  }
  lockBreaks = lockBreaks.filter(l => !l.done);
}

/** Main gameplay update. Physics runs in fixed sub-steps for tight collision. */
function updatePlay(dt, inp) {
  const pr = inp.pressed, rl = inp.released;
  if (pr.Escape || pr.KeyP) { state = 'pause'; return; }
  if (pr.KeyM) Sound.toggleMute();
  runTime += dt;
  clock += dt;
  glareCd -= dt;
  if (P.dead) {
    P.deadT -= dt;
    if (P.deadT <= 0) respawn();
  } else {
    if (pr.Space || pr.KeyW || pr.ArrowUp) P.jumpBuf = 0.12;
    if ((pr.ShiftLeft || pr.ShiftRight) && P.abilities.dash && P.dashCd <= 0 && !P.dead) {
      const ix = ((keys.KeyD || keys.ArrowRight) ? 1 : 0) - ((keys.KeyA || keys.ArrowLeft) ? 1 : 0);
      startDash(P, ix || P.face); activeTool = 'dash';
    }
    if (pr.KeyE) castTendril(false);
    if (pr.Mouse0) castTendril(true);
    if (P.abilities.glare) {
      if (pr.KeyQ) { aiming = true; reticle.t = 0; reticle.x = 0; activeTool = 'glare'; }
      if (aiming && (rl.KeyQ || !keys.KeyQ)) fireGlare();
      if (pr.Mouse2) {
        mouse.lastMove = clock; aiming = true; reticle.x = mouse.x; reticle.y = mouse.y + camY;
        updateGlareAim(1); fireGlare();
      }
    }
  }
  updateTendril(dt);
  updateGlareAim(dt);
  updateSpawners(dt);
  const n = Math.max(1, Math.ceil(dt * STEP_HZ)), h = dt / n;
  for (let i = 0; i < n; i++) {
    updateMovers(h);
    updateBoulders(h);
    updatePlayer(h);
    checkHazards();
  }
  updatePickups();
  updateLockBreaks(dt);
  // animation & squash-stretch recovery
  P.animT += dt * (P.onGround ? Math.max(0.4, Math.abs(P.vx) / RUN_SPEED) : 1);
  P.sx += (1 - P.sx) * Math.min(1, dt * 12); P.sy += (1 - P.sy) * Math.min(1, dt * 12);
  if (!P.onGround && P.vy < -150 && P.dashT <= 0) { P.sy = Math.max(P.sy, 1.08); P.sx = Math.min(P.sx, 0.93); }
  for (const g of P.ghosts) g.a -= dt * (P.dashT > 0 ? 0 : 2.2);
  if (P.dashT <= 0) P.ghosts = P.ghosts.filter(g => g.a > 0);
  updateCamera(dt);
  for (let room = 0; room < 3; room++) if (Math.abs(room * ROOM_H - camY) < H) ambient(dt, room);
  updateParticles(dt);
  if (toast) { toast.t += dt; if (toast.t > toast.dur) toast = null; }
  shakeT -= dt; if (shakeT <= 0) shakeMag = 0;
  flash = Math.max(0, flash - dt * 2);
}

/* ----- title screen ----- */
function drawTitle(dt) {
  clock += dt;
  titleCam = 600 + 600 * Math.cos(clock * 0.09);       // slow pan through all three biomes
  camY = titleCam;
  updateMovers(dt); updateSpawners(dt); updateBoulders(dt);
  for (let room = 0; room < 3; room++) if (Math.abs(room * ROOM_H - camY) < H) ambient(dt, room);
  updateParticles(dt);
  drawWorld(false);
  const v = ctx.createLinearGradient(0, 0, 0, H);
  v.addColorStop(0, 'rgba(10,4,24,0.75)'); v.addColorStop(0.45, 'rgba(10,4,24,0.35)'); v.addColorStop(1, 'rgba(10,4,24,0.85)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  // logo with a shimmer sweep
  const lx = Math.round(W / 2 - logo.width / 2), ly = 40 + Math.round(Math.sin(clock * 1.2) * 3);
  ctx.drawImage(logo, lx, ly);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const sx = ((clock * 260) % 1400) - 300;
  const sg = ctx.createLinearGradient(sx, 0, sx + 80, 0);
  sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(0.5, 'rgba(255,255,255,0.25)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sg; ctx.fillRect(lx, ly + 10, logo.width, logo.height - 30);
  ctx.restore();
  for (let i = 0; i < 2; i++) sparkle(lx + rand(30, logo.width - 30), ly + rand(20, logo.height - 30), Math.random() < 0.5 ? '#fff3b0' : '#ffb8e6', 1, 15);
  ctx.drawImage(logoSmall, Math.round(W / 2 - logoSmall.width / 2), ly + logo.height - 22);
  // narrative
  glassPanel(110, 245, 580, 190, 14);
  const lines = [
    'Born without a single spark of magic, you were cast out of',
    'Lurielle Village, a powerless wizard with nothing but a staff.',
    '',
    'Yet every night the great dragon Eldaria sings from the summit',
    'of the Sylvan Sanctuary, and her song leaves echoes of power',
    'scattered along the climb.',
    '',
    'Gather the echoes. Ascend the falls. Reach the dragon.',
  ];
  lines.forEach((l, i) => text(l, W / 2, 268 + i * 19, 14, i === 7 ? '#ffe08a' : '#ece6ff', 'center', 'Georgia, serif', i === 7 ? 'bold' : 'normal'));
  // start button
  const pulse = 0.5 + 0.5 * Math.sin(clock * 4);
  ctx.fillStyle = `rgba(255,107,203,${0.15 + pulse * 0.2})`;
  roundRect(ctx, startBtn.x - 6, startBtn.y - 6, startBtn.w + 12, startBtn.h + 12, 14); ctx.fill();
  const bg = ctx.createLinearGradient(0, startBtn.y, 0, startBtn.y + startBtn.h);
  bg.addColorStop(0, '#b469d6'); bg.addColorStop(1, '#5e2a7e');
  ctx.fillStyle = bg; roundRect(ctx, startBtn.x, startBtn.y, startBtn.w, startBtn.h, 10); ctx.fill();
  ctx.strokeStyle = '#ffd6f5'; ctx.lineWidth = 2; roundRect(ctx, startBtn.x + 1, startBtn.y + 1, startBtn.w - 2, startBtn.h - 2, 10); ctx.stroke();
  text('Press Enter to Begin', W / 2, startBtn.y + startBtn.h / 2 + 1, 18, '#ffffff', 'center', 'Georgia, serif');
  text('Move A/D  ·  Jump W/Space  ·  Dash Shift  ·  Tendril E/Click  ·  Glare Q/Right-click  ·  Pause P  ·  Mute M', W / 2, 560, 10, 'rgba(230,220,255,0.8)', 'center');
  shakeT = 0; flash = 0;
}

/* ----- victory screen ----- */
function drawVictory(dt) {
  clock += dt; victoryT += dt;
  // celebratory particle fountain from the emblem + fireworks
  for (let i = 0; i < 6; i++) {
    const a = -Math.PI / 2 + rand(-0.5, 0.5), s = rand(180, 360);
    particles.push({ x: emblem.x, y: emblem.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(1, 2), max: 2, size: rand(2, 4) | 0, col: ['#fff3b0', '#ff6bcb', '#74b9ff', '#2ecc71', '#f6b93b'][i % 5], g: 380, type: 'sq' });
  }
  if (Math.random() < dt * 2.5) {
    const fx = rand(100, 700), fy = rand(40, 260), col = ['#ff6bcb', '#74b9ff', '#fff176', '#7bed9f'][Math.floor(Math.random() * 4)];
    for (let i = 0; i < 36; i++) { const a = i / 36 * TAU; particles.push({ x: fx, y: fy, vx: Math.cos(a) * 140, vy: Math.sin(a) * 140, life: 1.1, max: 1.1, size: 2, col, g: 90, type: 'sq' }); }
    Sound.fx.coin();
  }
  updateMovers(dt); updateParticles(dt);
  P.animT += dt; P.sx += (1 - P.sx) * 0.2; P.sy += (1 - P.sy) * 0.2;
  drawWorld(true);
  ctx.fillStyle = `rgba(10,4,24,${Math.min(0.55, victoryT * 0.4)})`; ctx.fillRect(0, 0, W, H);
  if (victoryT > 0.8) {
    const a = Math.min(1, (victoryT - 0.8) * 2);
    ctx.globalAlpha = a;
    glassPanel(180, 170, 440, 290, 16);
    drawEmblem(W / 2, 215, 0.9);
    text('Eldaria Awakens', W / 2, 270, 30, '#ffe08a', 'center', 'Georgia, serif');
    text('Her song answers yours. The echoes are whole again.', W / 2, 298, 12, '#ece6ff', 'center', 'Georgia, serif', 'normal');
    const got = coins.filter(c => c.taken).length;
    text('Completion Time', 240, 336, 14, '#c8c8ff'); text(fmtTime(runTime), 560, 336, 16, '#ffffff', 'right');
    text('Coins Collected', 240, 362, 14, '#c8c8ff'); text(`${got} / ${coins.length}`, 560, 362, 16, '#fff176', 'right');
    text('Falls & Mishaps', 240, 388, 14, '#c8c8ff'); text(String(deaths), 560, 388, 16, '#ff9be0', 'right');
    if (got === coins.length) text('★ Every coin found! ★', W / 2, 414, 13, '#fff176', 'center');
    text('Press Enter to return to the title', W / 2, 440, 12, `rgba(255,255,255,${0.5 + 0.5 * Math.sin(clock * 4)})`, 'center');
    ctx.globalAlpha = 1;
  }
}

/* ----- pause overlay ----- */
function drawPause() {
  drawWorld(true);
  ctx.fillStyle = 'rgba(10,4,24,0.6)'; ctx.fillRect(0, 0, W, H);
  glassPanel(W / 2 - 170, H / 2 - 70, 340, 140, 14);
  text('Paused', W / 2, H / 2 - 30, 30, '#ffe08a', 'center', 'Georgia, serif');
  text('P / Esc to resume  ·  M to mute', W / 2, H / 2 + 10, 12, '#ece6ff', 'center');
  text('R to restart from the title', W / 2, H / 2 + 34, 12, '#c8c8ff', 'center');
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const inp = takeInput();
  ctx.imageSmoothingEnabled = false;
  if (state === 'title') {
    if (inp.pressed.Enter || inp.pressed.NumpadEnter || inp.pressed.Space) beginPlay();
    else if (inp.pressed.Mouse0) {
      const m = mouse;
      if (m.x > startBtn.x && m.x < startBtn.x + startBtn.w && m.y > startBtn.y && m.y < startBtn.y + startBtn.h) beginPlay();
    }
    if (state === 'title') drawTitle(dt);
  }
  if (state === 'play') {
    updatePlay(dt, inp);
    if (state === 'play') { drawWorld(true); drawReticle(); drawHUD(); }
  }
  if (state === 'pause') {
    if (inp.pressed.Escape || inp.pressed.KeyP || inp.pressed.Mouse0) state = 'play';
    else if (inp.pressed.KeyR) { newGame(); state = 'title'; }
    if (inp.pressed.KeyM) Sound.toggleMute();
    if (state === 'pause') drawPause();
  }
  if (state === 'victory') {
    if (victoryT > 1.2 && (inp.pressed.Enter || inp.pressed.NumpadEnter)) { newGame(); state = 'title'; }
    else drawVictory(dt);
  }
  requestAnimationFrame(frame);
}

/* ----- boot ----- */
buildBackgrounds();
buildWizard();
logo = makePixelText('Echoes of Eldoria', 'bold 22px Georgia, serif', 3, '#fff3b0', '#f6b93b', '#e58e26');
logoSmall = makePixelText('~ a tale of a powerless wizard ~', 'italic 11px Georgia, serif', 2, '#ffd6f5', '#ff9be0', '#d980fa');
newGame();
requestAnimationFrame(frame);

// Tiny debug/test hook (harmless in normal play)
window.__eoe = {
  get state() { return state; }, get P() { return P; }, get camRoom() { return camRoom; },
  tp(x, y) { P.x = x; P.y = y; P.vx = P.vy = 0; },
  unlockAll() { P.abilities = { dash: true, tendril: true, glare: true }; },
  get boulders() { return boulders; },
};
</script>
